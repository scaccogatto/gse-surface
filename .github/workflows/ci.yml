name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    env:
      ZIP_PATH: ${{ github.workspace }}/surface-control@scaccogatto.github.com.shell-extension.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: JS syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Shell scripts (shellcheck)
        run: shellcheck setup-permissions.sh scripts/pack.sh

      - name: udev rule syntax
        run: |
          bash setup-permissions.sh --print udev > "$RUNNER_TEMP/70-surface-control.rules"
          udevadm verify "$RUNNER_TEMP/70-surface-control.rules"

      - name: LICENSE copies are identical
        run: cmp LICENSE surface-control@scaccogatto.github.com/LICENSE

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install shexli
        run: pip install -r requirements-ci.txt

      # gnome-extensions pack requires gnome-shell, which isn't installed on
      # ubuntu runners: build the EGO submission zip with the same script the
      # docs and the release workflow use.
      - name: Build submission zip
        run: sh scripts/pack.sh "$ZIP_PATH"

      - name: Run shexli (GNOME Shell extension static analysis)
        run: python3 scripts/shexli_gate.py surface-control@scaccogatto.github.com "$ZIP_PATH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-control-shell-extension
          path: ${{ env.ZIP_PATH }}
