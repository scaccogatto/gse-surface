name: Release

# Attaches the EGO submission zip to every published GitHub release, so the
# release carries the exact artifact that is uploaded to extensions.gnome.org.
on:
  release:
    types: [published]

permissions: {}

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      ZIP_PATH: ${{ github.workspace }}/surface-control@scaccogatto.github.com.shell-extension.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build submission zip
        run: sh scripts/pack.sh "$ZIP_PATH"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ZIP_PATH" --clobber
